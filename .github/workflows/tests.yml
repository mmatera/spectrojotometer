name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy, scipy and pymatgen require Python >= 3.11.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Virtual display, so that the Tk tests of visualbond run too.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run the tests
        run: xvfb-run -a python -m pytest -ra
  # Build the distributions and use them as a user would: installed in a
  # clean environment, not in editable mode, outside the repository.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The wheel contains only the spectrojotometer package
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          top = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          extra = {t for t in top if t != "spectrojotometer" and not t.endswith(".dist-info")}
          assert not extra, f"unexpected top-level entries in the wheel: {extra}"
          PY

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/user
          /tmp/user/bin/pip install dist/*.whl

      - name: Use the installed package
        working-directory: /tmp
        env:
          EXAMPLES: ${{ github.workspace }}/examples
        run: |
          export PATH=/tmp/user/bin:$PATH
          for cmd in bond_generator evaluate_cc map_configs optimize-configurations print_equations; do
            "$cmd" --help > /dev/null
          done
          command -v visualbond
          evaluate_cc "$EXAMPLES/example1.cif" "$EXAMPLES/example1.spin" | grep J0
          # The GUI must be importable without a display (no window on import).
          env -u DISPLAY python -c "import spectrojotometer.gui, spectrojotometer.cli.visualbond"
          python - <<'PY'
          import os, re, spectrojotometer
          doc = os.path.join(spectrojotometer.__path__[0], "doc")
          html = open(os.path.join(doc, "tutorial.html")).read()
          missing = [s for s in re.findall(r'src="([^"]+)"', html)
                     if not os.path.exists(os.path.join(doc, s))]
          assert not missing, f"images of the tutorial not installed: {missing}"
          PY
