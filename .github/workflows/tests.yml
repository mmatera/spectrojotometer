name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy, scipy and pymatgen require Python >= 3.11.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Virtual display, so that the Tk tests of visualbond run too.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff

      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run the tests
        run: xvfb-run -a python -m pytest -ra